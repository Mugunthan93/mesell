# k8s/svc-category/ingressroute.yaml
# ---------------------------------------------------------------------------
# svc-category — Sub-Plan F (category extraction, MS-4), INFRA deliverable I4.
#
# Traefik IngressRoute (path-prefix gateway, MASTER_PLAN §2.C) routing the 5 PUBLIC
# category routes + the 2-3 /internal/* shims on api.mesell.xyz to svc-category:8001.
#
# ── PUBLIC routes — cited from backend/app/modules/category/router.py (SSOT) ──
#   router.py:77  APIRouter(prefix="/api/v1", tags=["category"])
#   router.py:84  GET /api/v1/categories/suggest                  (smart picker)
#   router.py:133 GET /api/v1/categories/browse                   (tree browse)
#   router.py:178 GET /api/v1/categories                          (list)
#   router.py:220 GET /api/v1/categories/{id}/schema              (catalog hot path)
#   router.py:269 GET /api/v1/categories/{id}/field-enum/{name}   (enum lookup)
#   ⇒ EVERY public route is under the `/api/v1/categories` prefix. ALL are GET.
#
# ── /internal routes (the FROZEN shims category exposes — SUB_PLAN_0F §F4) ─────
#   GET /internal/categories/{id}/schema           ← shim #1 (callers: export, catalog)
#   GET /internal/categories/{id}/field-enum/{field}← shim #2 (caller: export)
#   GET /internal/categories/{id}/commission       ← shim #3 (caller: pricing-svc,
#                                                     ALREADY a pod at MS-4 — its
#                                                     category_client dials this;
#                                                     verified at
#                                                     backend/services/svc-pricing/app/
#                                                     core/extracted_clients/category_client.py:81)
#   GET /internal/categories/super-categories      ← latent shim (customer-svc, MS-E,
#                                                     already a pod — defensive per
#                                                     §F4 "author defensively unless
#                                                     the master session confirms
#                                                     unneeded")
#   ⇒ EVERY internal shim is under the `/internal/categories` prefix. ALL are GET.
#
# ── ROUTING DISCIPLINE — why a PathPrefix is SAFE here (UNLIKE pricing/image) ──
#   The image/export/pricing services own SUB-routes UNDER /api/v1/products/* — a
#   path family that as a WHOLE belongs to catalog-svc (MS-5) — so they MUST use
#   tight PathRegexp anchored to their leaf suffix (…/images, …/export-xlsx,
#   …/price-calc) to avoid hijacking catalog routes.
#
#   svc-category is DIFFERENT: the `/api/v1/categories` path segment is
#   category-EXCLUSIVE — NO other service (present or future per the A-H extraction
#   map) owns any route under `/api/v1/categories`. So a `PathPrefix(/api/v1/categories)`
#   is correct and safe: it claims exactly category's surface and collides with
#   nothing. Likewise `/internal/categories` is category-exclusive (export/pricing
#   dial INTO it; they expose their own /internal/* under different prefixes, if any).
#   The two PathPrefix rules below are DISJOINT from every sibling carve-out:
#     • svc-image    /api/v1/products/{id}/images        — different prefix (products)
#     • svc-export   /api/v1/products/{id}/export-xlsx + /api/v1/exports — different
#     • svc-pricing  /api/v1/products/{id}/price-calc    — different prefix (products)
#     • svc-dashboard GET /api/v1/products (exact)        — different prefix (products)
#     • svc-category /api/v1/categories/* + /internal/categories/*  — THIS service
#   No /products overlap, no /categories contention. Method filtering is NOT needed
#   (no POST/PUT shares a category path key — all 5 public + all internal are GET;
#   the FastAPI app rejects non-GET with 405).
#
#   PRECEDENCE vs the monolith host-Ingress: the live api.mesell.xyz Ingress
#   (TF-managed, k8s/ingress.yaml doc) routes ALL of api.mesell.xyz → api:80
#   (monolith). A Path/PathPrefix match outscores a host-only Ingress on path
#   specificity in Traefik, so these two prefix rules peel category's surface off the
#   monolith onto svc-category. Cutover ordering + monolith-fallback (point the rule
#   back at api:80 on rollback) is handled at the founder-gated deploy
#   (MASTER_PLAN §3.C / the svc-category runbook). For Sub-Plan F (dev, zero-traffic)
#   these rules simply route category's paths to the new pod.
#
# ── TLS + CORS (TLS NAME = LIVE `api-tls`, per the svc-pricing precedent) ──────
#   - TLS: the api.mesell.xyz LE certificate (cert-manager, Ready since Phase B) is
#     reused. *** The LIVE dev secret name is `api-tls` *** (verified against the
#     live cluster 2026-06-13 by the svc-pricing lane: `kubectl get ingress api -n dev`
#     → secret=`api-tls`; `kubectl get certificate -n dev` → `api-tls` READY=True).
#     svc-category uses `api-tls` (NOT the stale `api-mesell-xyz-tls` that the
#     svc-image/svc-export precedents reference — that name does NOT exist in the dev
#     namespace and is a LATENT DEFECT in those still-IN-REVIEW precedents). Per
#     playbook §0 (live state is SSOT), svc-category serves a valid LE cert at
#     cutover. entryPoint `websecure`.
#   - CORS / Set-Cookie: NO `headers` Middleware is attached here. CORS is owned by
#     the FastAPI app (CORSMiddleware, vendored per service per MASTER_PLAN §5.A);
#     Traefik does routing + TLS ONLY and MUST NOT strip/rewrite CORS or Set-Cookie
#     (the R-SP7-1 P0 ADD-ONLY rule, same as the api Ingress + every sibling carve-out).
#
# Namespace: dev ONLY (Sub-Plan F constraint).
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: svc-category
  namespace: dev
  labels:
    app: svc-category
spec:
  entryPoints:
    - websecure
  routes:
    # PUBLIC — the 5 GET routes under /api/v1/categories (suggest, browse, list,
    # {id}/schema, {id}/field-enum/{name}). `/api/v1/categories` is category-exclusive
    # so a PathPrefix is correct + safe (no /products contention, no sibling overlap).
    - kind: Rule
      match: Host(`api.mesell.xyz`) && PathPrefix(`/api/v1/categories`)
      services:
        - name: svc-category
          port: 8001
    # INTERNAL — the 2-3 (+1 defensive) frozen /internal/* shims (schema, field-enum,
    # commission, super-categories). `/internal/categories` is category-exclusive.
    # At cutover this route flips export-svc + pricing-svc's category_client calls
    # from monolith → svc-category, transparent to their call sites (§16.G). NOTE:
    # /internal/* is reached IN-CLUSTER (cluster DNS) by the sibling pods; this
    # IngressRoute also exposes it on api.mesell.xyz for the strangler-window flip.
    # (V1.5 hardening may restrict /internal/* to cluster-only — that is a later
    # primitive; for the MS-4 strangler window the route flip is the mechanism.)
    - kind: Rule
      match: Host(`api.mesell.xyz`) && PathPrefix(`/internal/categories`)
      services:
        - name: svc-category
          port: 8001
  tls:
    # Reuse the existing api.mesell.xyz LE cert (cert-manager, Ready since Phase B).
    # LIVE dev secret name is `api-tls` (verified 2026-06-13) — NOT `api-mesell-xyz-tls`
    # (the stale name in the svc-image/svc-export precedents, absent in dev).
    secretName: api-tls
