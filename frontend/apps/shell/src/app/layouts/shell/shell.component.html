<div class="mee-layout" [ngClass]="layoutClass()">
  <mee-topbar></mee-topbar>
  <mee-sidebar></mee-sidebar>

  <!-- Backdrop for mobile/overlay -->
  @if (layoutService.isSidebarActive()) {
    <div class="mee-layout__mask" (click)="layoutService.closeMobileMenu()"></div>
  }

  <!-- Main content -->
  <div class="mee-layout__main">
    <router-outlet />
  </div>

  <!-- Mobile bottom tab bar (≤639px) -->
  <nav class="mee-bottom-nav" aria-label="Mobile navigation">
    @for (item of bottomNavItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="mee-bottom-nav__item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mee-bottom-nav__item"
        [attr.aria-label]="item.label"
      >
        <i [class]="iconClass(item.icon)" aria-hidden="true"></i>
        <span class="mee-bottom-nav__label">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
