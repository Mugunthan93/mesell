<div class="shell-layout">
  <!-- Desktop sidebar — chrome primitive; positioning via .sidebar-desktop (shell-owned).
       Founder-approved 4 groups (Home / Catalogs / Categories / Account). -->
  <mee-side-nav
    class="sidebar-desktop"
    brand="MeeSell"
    [groups]="visibleNavGroups()"
  />

  <!-- Mobile sidebar overlay — shell owns the drawer; the side-nav is its content.
       Closing on navigate keeps the original UX (tap a link → drawer closes). -->
  <mee-drawer
    [visible]="mobileSidebarVisible()"
    (visibleChange)="mobileSidebarVisible.set($event)"
    styleClass="mee-mobile-sidebar"
    [modal]="true"
  >
    <mee-side-nav
      brand="MeeSell"
      [groups]="visibleNavGroups()"
      (navigated)="mobileSidebarVisible.set(false)"
    />
  </mee-drawer>

  <!-- Main content area -->
  <div class="shell-main">
    <!-- Top header — chrome primitive; hamburger opens the mobile drawer,
         the user menu is projected into the trailing actions region. -->
    <mee-app-bar (menuToggle)="mobileSidebarVisible.set(true)">
      <mee-user-menu [initials]="userInitials" [items]="userMenuItems" />
    </mee-app-bar>

    <!-- Page content — shell owns the <main> landmark -->
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
