# .github/workflows/deploy-frontend.yml
#
# MeeSell — Frontend deploy to GitHub Pages (2026-06-30 platform pivot).
#
# The federated Angular workspace is built and published to GitHub Pages under
# /mesell/. The HOST (shell) project in angular.json is named `frontend` (root
# apps/shell) — NOT "shell". The seven cutover remotes are mfe-auth, mfe-billing,
# mfe-catalog, mfe-dashboard, mfe-export, mfe-onboarding, mfe-pricing.
#
# ── WHY A MATRIX (2026-07-02 rework) ─────────────────────────────────────────
# Historically the pre-matrix SEQUENTIAL design let native-federation's cold
# "Preparing shared npm packages" phase dominate: the first sequential run spent
# 23+ min on the shell alone and hit the 30-min job timeout (8 sequential builds
# = ~192 min — never fits). Fix: one runner per project (the same pattern ci.yml
# frontend-build uses), built dist uploaded as an artifact, then a single publish
# job assembles the GitHub Pages layout and deploys via actions/deploy-pages.
# The NF prepare cache (node_modules/.cache + .angular/cache) is actions/cache'd.
#
# MEASURED CORRECTION (runs 28610655843 cold-MISS / 28614840041 warm, 2026-07-02):
# under this matrix the prepare phase is only 8-18 s per project (cold ≈ warm) —
# the ~24-min stall was a sequential-era artifact and does NOT recur per runner.
# The real cost is pathology (b) in the Build step (the post-emit hang), now
# fixed there by kill-on-artifact-ready instead of a fixed 35-min wait.
#
# Native federation layout: the shell index.html is the served entrypoint
# (base-href /mesell/). Each remote is loaded at runtime via remoteEntry.json,
# so remotes are published UNDER /mesell/remotes/<name>/ and the prod federation
# manifest (apps/shell/src/main.ts, env-aware) points there. Remote chunks
# resolve relative to their own remoteEntry.json URL — no base-href needed.
name: Deploy Frontend to GitHub Pages

# DEPLOYMENT STOPPED (2026-07-19, founder-directed teardown): MeeSell's GitHub
# Pages + Fly.io deployment was shut down to stop all billing. Auto-deploy on
# push is disabled; only manual dispatch remains, and the build job is if:false
# guarded below (publish + deploy `needs: build`, so both skip) — a manual run is
# a no-op until the founder re-enables deploys. Do NOT delete: kept for restore.
on:
  # push trigger removed 2026-07-19 (teardown). Restore by re-adding:
  #   push:
  #     branches: [develop]
  #     paths: ['frontend/**']
  workflow_dispatch:

# Allow the publish job to push the gh-pages branch.
permissions:
  contents: write

jobs:
  build:
    name: "Build: ${{ matrix.project }}"
    # DEPLOYMENT STOPPED 2026-07-19 (teardown) — no-op guard. publish + deploy
    # jobs `needs: build`, so guarding build skips the whole Pages publish chain.
    # Restore by removing this `if: false` line.
    if: false
    runs-on: ubuntu-latest
    # kill-on-artifact-ready (see the Build step) bounds each leg to ~1.5-2 min;
    # this cap only backstops the 8-min inner fallback + setup/upload overhead.
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        project:
          - frontend      # shell/host — built with --base-href /mesell/
          - mfe-auth
          - mfe-billing
          - mfe-catalog
          - mfe-dashboard
          - mfe-export
          - mfe-onboarding
          - mfe-pricing
    steps:
      - uses: actions/checkout@v4

      # The workspace is pnpm (frontend/pnpm-lock.yaml, packageManager pnpm@11.5.2).
      # Same toolchain as the CI frontend-build job — Node 22 + pnpm 11.5.2 +
      # frozen lockfile + explicit native rebuild (esbuild et al. are ignored
      # builds under pnpm and must be rebuilt or `ng build` fails on fresh CI).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.2'

      - name: Restore NF prepare + Angular caches
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/.cache
            frontend/.angular/cache
          key: nf-prepare-${{ matrix.project }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            nf-prepare-${{ matrix.project }}-

      - name: pnpm install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm rebuild native binaries
        working-directory: frontend
        run: pnpm rebuild esbuild @parcel/watcher lmdb msgpackr-extract

      - name: Build ${{ matrix.project }} (production)
        working-directory: frontend
        # Shell gets the Pages base-href; remotes resolve relative to their own
        # remoteEntry.json URL and need none.
        #
        # The NF builder has TWO documented CI pathologies:
        #  (a) COLD "Preparing shared npm packages" stall — historically ~24 min
        #      on the pre-matrix SEQUENTIAL design; under this matrix it does NOT
        #      recur (measured 8-18 s on cold-cache-MISS run 28610655843).
        #  (b) POST-EMIT HANG (the real cost): the builder writes the FULL dist
        #      output and then never exits — open esbuild/@parcel/watcher handles
        #      keep node alive. Measured: the artifact lands ~20-30 s after the
        #      step starts, then the process hangs ~34.5 min until killed (run
        #      28610655843: shell emit done 17:53:48, killed 18:28:27 by the old
        #      fixed 35-min `timeout`). Cold ≈ warm — the emit time barely moves.
        # The old fixed `timeout 35m` therefore burned ~34.5 min of pure waste per
        # leg × 8 legs. REMEDY: KILL-ON-ARTIFACT-READY — run ng build in the
        # background in its own process group, poll for the emitted artifact,
        # confirm the dist dir is quiescent (stable file-count + byte-size across
        # two 15 s samples), then kill the group. Success is judged by the
        # artifact gate, NOT the exit code. FALLBACK_SECS (8 min ≈ 16× the
        # measured cold artifact-ready) is the hard ceiling if the artifact never
        # appears; lockfile changes evict the cache, so it still clears a fully
        # cold run with wide headroom.
        run: |
          set +e
          if [ "${{ matrix.project }}" = "frontend" ]; then
            ARTIFACT="dist/frontend/browser/index.html"
          else
            ARTIFACT="dist/${{ matrix.project }}/browser/remoteEntry.json"
          fi
          DISTDIR="dist/${{ matrix.project }}"
          FALLBACK_SECS=480   # 8-min hard fallback if the artifact never appears

          # Launch ng build in its OWN process group (setsid) so the whole tree
          # (esbuild/watcher children that keep node alive) can be killed once
          # the dist is written.
          if [ "${{ matrix.project }}" = "frontend" ]; then
            setsid pnpm exec ng build frontend --configuration production --base-href /mesell/ > /tmp/ngbuild.log 2>&1 &
          else
            setsid pnpm exec ng build ${{ matrix.project }} --configuration production > /tmp/ngbuild.log 2>&1 &
          fi
          BPID=$!
          echo "ng build launched (pgid $BPID); polling for $ARTIFACT (fallback ${FALLBACK_SECS}s)"

          DEADLINE=$(( $(date +%s) + FALLBACK_SECS ))
          ready=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ -f "$ARTIFACT" ]; then ready=1; break; fi
            kill -0 "$BPID" 2>/dev/null || { echo "build ended before artifact appeared"; break; }
            sleep 10
          done

          if [ "$ready" = "1" ]; then
            echo "artifact present; waiting for dist to go quiescent"
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              c1=$(find "$DISTDIR" -type f | wc -l | tr -d ' ')
              b1=$(du -sb "$DISTDIR" | cut -f1)
              sleep 15
              c2=$(find "$DISTDIR" -type f | wc -l | tr -d ' ')
              b2=$(du -sb "$DISTDIR" | cut -f1)
              if [ "$c1" = "$c2" ] && [ "$b1" = "$b2" ]; then
                echo "dist quiescent: $c2 files, $b2 bytes"
                break
              fi
              echo "dist still settling: files $c1->$c2 bytes $b1->$b2"
            done
          fi

          # Kill the whole build process group (the post-emit hang never exits).
          kill -TERM -"$BPID" 2>/dev/null || kill -TERM "$BPID" 2>/dev/null || true
          sleep 2
          kill -KILL -"$BPID" 2>/dev/null || kill -KILL "$BPID" 2>/dev/null || true
          wait "$BPID" 2>/dev/null
          tail -n 3 /tmp/ngbuild.log 2>/dev/null || true
          echo "build group $BPID terminated post-artifact-ready"
          set -e

          # Hard artifact gate — the real success signal (unchanged).
          if [ "${{ matrix.project }}" = "frontend" ]; then
            test -f dist/frontend/browser/index.html
          else
            test -f "dist/${{ matrix.project }}/browser/remoteEntry.json"
          fi
          echo "artifact gate passed for ${{ matrix.project }}"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.project }}
          path: frontend/dist/${{ matrix.project }}
          retention-days: 3
          if-no-files-found: error

  publish:
    name: "Assemble + upload Pages artifact"
    runs-on: ubuntu-latest
    needs: build
    # Measured 6-12 s (runs 28610655843 / 28614840041 / 28631588555).
    timeout-minutes: 10
    # Workflow-type Pages deployment (actions/deploy-pages in the deploy job
    # below). The legacy branch-sourced pipeline failed twice on 2026-07-02
    # ("Deployment failed, try again later", then a 10-min backend timeout)
    # with a healthy 28MB/1552-file payload — build_type=workflow bypasses the
    # legacy Jekyll pipeline entirely.
    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist  # each artifact lands in dist/dist-<project>/

      - name: Assemble GitHub Pages publish dir (shell at root + remotes/<name>/)
        # The prod federation manifest expects remotes at
        # /mesell/remotes/<name>/remoteEntry.json, so lay the shell at the
        # publish root and each remote under remotes/<name>/.
        run: |
          set -euo pipefail
          rm -rf gh-pages && mkdir -p gh-pages
          cp -r dist/dist-frontend/browser/. gh-pages/
          for mfe in mfe-auth mfe-billing mfe-catalog mfe-dashboard mfe-export mfe-onboarding mfe-pricing; do
            test -d "dist/dist-$mfe/browser" || { echo "missing artifact for $mfe"; exit 1; }
            mkdir -p "gh-pages/remotes/$mfe"
            cp -r "dist/dist-$mfe/browser/." "gh-pages/remotes/$mfe/"
            echo "Staged remote $mfe"
          done
          # PROD federation manifest — OVERWRITE the dev manifest (localhost ports)
          # that ships in the shell dist. main.ts fetches federation.manifest.json
          # relative to <base href>, so this file is the single prod config surface.
          # (main.ts must never import @mesell/env to pick a manifest — F-001
          # chicken-and-egg with the import map; see apps/shell/src/main.ts.)
          cat > gh-pages/federation.manifest.json << 'MANIFEST'
          {
            "mfe-auth": "https://mugunthan93.github.io/mesell/remotes/mfe-auth/remoteEntry.json",
            "mfe-billing": "https://mugunthan93.github.io/mesell/remotes/mfe-billing/remoteEntry.json",
            "mfe-catalog": "https://mugunthan93.github.io/mesell/remotes/mfe-catalog/remoteEntry.json",
            "mfe-dashboard": "https://mugunthan93.github.io/mesell/remotes/mfe-dashboard/remoteEntry.json",
            "mfe-export": "https://mugunthan93.github.io/mesell/remotes/mfe-export/remoteEntry.json",
            "mfe-onboarding": "https://mugunthan93.github.io/mesell/remotes/mfe-onboarding/remoteEntry.json",
            "mfe-pricing": "https://mugunthan93.github.io/mesell/remotes/mfe-pricing/remoteEntry.json"
          }
          MANIFEST
          # SPA fallback for GitHub Pages deep links; disable Jekyll (_-prefixed NF chunks).
          cp gh-pages/index.html gh-pages/404.html
          touch gh-pages/.nojekyll
          ls gh-pages | head -20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  # Deploy is its OWN job (GitHub starter-workflow pattern) for rerun safety:
  # the Pages backend intermittently fails deployments ("Deployment failed,
  # try again later" — 3x on 2026-07-05). Rerunning a combined job re-executes
  # upload-pages-artifact, and v4 artifacts are immutable — duplicates pile up
  # until deploy-pages hard-fails with "Multiple artifacts named github-pages"
  # (required manual artifact deletion via API to recover). With deploy split
  # out, `gh run rerun --failed` re-runs ONLY this job: no re-upload, no
  # duplicates, safe to retry any number of times.
  deploy:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
