# valkey.conf — MeeSell self-hosted Valkey 8 (config-as-code).
#
# The requirepass PASSWORD IS NOT IN THIS FILE. It is injected at runtime by
# docker-entrypoint.sh via `--requirepass "$VALKEY_PASSWORD"` (a Fly secret),
# so no secret is ever committed to git. See README.md.
#
# This instance backs the LOCKED 4-logical-DB Valkey topology that
# backend/app/shared/valkey.py enforces (BACKEND_ARCHITECTURE §1.B/§5.C):
#   DB 0 = OTP / sliding-window RL / sessions / refresh-token allowlist
#   DB 1 = Celery broker
#   DB 2 = Celery result backend
#   DB 3 = application read-through cache (schemas, enums, category tree, seller-profile)
# Upstash (the resource this replaces) supports ONLY DB 0 -> every DB1/2/3 op 500'd.
# A self-hosted Valkey supports DBs 0-15 natively -> keeps the locked topology byte-identical.

# ── Network ──────────────────────────────────────────────────────────────────
# Bind IPv6 (Fly 6PN private network is IPv6 — this is how meesell-api reaches
# us at meesell-valkey.internal) AND IPv4 (local health probes on 127.0.0.1).
# Redis/Valkey sets IPV6_V6ONLY on the :: socket, so binding both is safe.
bind 0.0.0.0 ::
port 6379
# Private-only service: the Fly app has NO public IP (no [http_service]/[[services]]
# in fly.toml), and requirepass gates every connection. Disabling protected-mode
# just makes it explicit that authenticated 6PN peers are the intended clients.
protected-mode no

# ── Persistence: DISABLED (EPHEMERAL — no Fly volume) ────────────────────────
# TODO(volume): bom had NO volume capacity at provision time (2026-07-11) —
# `fly volumes create valkey_data --region bom` returned "no capacity available in
# bom" across ~12 attempts. So this deployed EPHEMERAL (pure in-memory) to ship the
# multi-DB fix NOW. This is SAFE for THIS workload — every logical DB holds
# rebuildable/transient data:
#   DB0  OTP is TTL'd; sessions/refresh-allowlist re-establish on re-login.
#   DB1  Celery broker queue is transient (jobs idempotent + re-triggerable).
#   DB2  Celery results are transient.
#   DB3  read-through cache repopulates on miss.
# A machine restart losing all of it is acceptable dev/staging-grade.
# WHEN bom volume capacity returns: `fly volumes create valkey_data --size 1
# --region bom -a meesell-valkey`, restore the [mounts] block in fly.toml, flip the
# two lines below back to `appendonly yes` / `appendfsync everysec`, and redeploy.
dir /data
appendonly no
save ""

# ── Memory ───────────────────────────────────────────────────────────────────
# 180MB data ceiling on a 256MB machine leaves ~76MB for Valkey overhead + the
# AOF-rewrite fork COW + the OS. It is a defensive cap (the real working set —
# category-tree cache + enums + sessions + a small broker queue — is only a few MB),
# so that Valkey REFUSES writes loudly before the kernel OOM-kills the process
# (which would drop the in-flight AOF buffer).
maxmemory 180mb
# noeviction — deliberately NOT allkeys-lru. This is a MIXED multi-DB instance:
# silent LRU eviction could drop a queued Celery job (DB1) or an active session /
# refresh-allowlist entry (DB0). The DB3 read-through cache self-bounds via the
# app's per-entry TTLs (core/cache.py), so it does not need eviction here.
maxmemory-policy noeviction
